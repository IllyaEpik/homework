<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Products</h1>
    {% for product in products %}
        <hr>
        <h2>{{product.name}}</h2>
        <h3>id: {{product.sku}}</h3>
        <img src="{{product.image.url}}" alt="">
        <h3>price: {{product.price}}$</h3>
    {% endfor %}
</body>
</html>
